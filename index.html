<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Linktree Estilo - Gabriella Martins</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 3px solid #4caf50;
    }
    h1 {
      margin: 0 0 15px 0;
      color: #333;
    }
    .links {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 320px;
    }
    .link-button {
      background-color: #4caf50;
      color: white;
      text-align: center;
      text-decoration: none;
      padding: 15px 20px;
      margin: 8px 0;
      border-radius: 8px;
      font-weight: 600;
      font-size: 18px;
      transition: background-color 0.3s ease;
      box-shadow: 0 4px 8px rgb(76 175 80 / 0.3);
    }
    .link-button:hover {
      background-color: #388e3c;
    }
    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>
<body>

  <img
    src="https://avatars.githubusercontent.com/u/your-avatar.png"
    alt="Foto de Gabriella Martins"
    class="profile-pic"
  />
  <h1>Gabriella Martins</h1>

  <div class="links">
    <a
      href="https://gabriellamartins0.github.io/Formulario-de-mudas/"
      target="_blank"
      rel="noopener noreferrer"
      class="link-button"
      >Formulário de Mudas</a
    >
    <a
      href="https://www.linkedin.com/in/gabriellamartins0"
      target="_blank"
      rel="noopener noreferrer"
      class="link-button"
      >LinkedIn</a
    >
    <a
      href="https://github.com/gabriellamartins0"
      target="_blank"
      rel="noopener noreferrer"
      class="link-button"
      >GitHub</a
    >
    <a
      href="mailto:contato@gabriellamartins.com"
      target="_blank"
      rel="noopener noreferrer"
      class="link-button"
      >Email</a
    >
  </div>

  <footer>© 2025 Gabriella Martins</footer>

</body>
</html>
